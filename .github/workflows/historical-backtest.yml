name: Public-data historical backtest

on:
  workflow_dispatch:
    inputs:
      network:
        description: Public market data only; all balances are virtual
        required: true
        default: mainnet
        type: choice
        options:
          - mainnet
          - testnet

permissions:
  contents: read

concurrency:
  group: historical-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NETWORK: ${{ inputs.network || 'mainnet' }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact run commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Software regression tests - not market performance
        run: python3 -m unittest discover -s tests -v
      - name: Backtest all 192 fixed scenarios on public historical data
        run: |
          mkdir -p evidence
          timeout --signal=TERM --kill-after=10s 1200s python3 -u reviewed_audit.py --network "$NETWORK" --out evidence/experiment 2>&1 | tee evidence/execution.log
      - name: Show current-run outcome
        if: always()
        run: python3 actions_summary.py
      - name: Preserve source-linked evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
