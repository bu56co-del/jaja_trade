name: A44 low volatility and micro confirmation
on:
  push:
    branches: [research/issue-1-chat-actions]
    paths: ['entry44/**', '.github/workflows/entry44.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: entry44-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}/application:${{ github.workspace }}/application/tests:${{ github.workspace }}/longer:${{ github.workspace }}/execution:${{ github.workspace }}/reversal44:${{ github.workspace }}/alternatives44:${{ github.workspace }}/mean44:${{ github.workspace }}/direction44:${{ github.workspace }}/refine44:${{ github.workspace }}/entry44
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore exact A44 parent without any market download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: refine44-final-35602620940-1
          run-id: '35602620940'
          github-token: ${{ github.token }}
          path: parent
      - name: Restore and preserve reviewed source
        run: |
          python3 bootstrap.py
          mkdir -p evidence
          cp -R application evidence/original-source
          cp -R entry44 evidence/entry44-source
          cp .github/workflows/entry44.yml evidence/workflow.yml
      - name: Original account and relevant parent regressions
        run: |
          timeout 180s python3 -m unittest discover -s application/tests -v 2>&1 | tee evidence/account-tests.log
          timeout 120s python3 -m unittest discover -s mean44/tests -v 2>&1 | tee evidence/mean-tests.log
          timeout 120s python3 -m unittest discover -s refine44/tests -v 2>&1 | tee evidence/refine-tests.log
      - name: New entry-state and account tests - artificial fixtures only
        run: timeout 120s python3 -m unittest discover -s entry44/tests -v 2>&1 | tee evidence/entry-tests.log
      - name: Replay all432 cases with network disabled
        id: experiment
        run: |
          nonce="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          echo "::stop-commands::$nonce"
          set +e
          timeout --signal=TERM --kill-after=10s 1320s python3 - <<'PY' 2>&1 | tee evidence/research.log
          import socket
          from pathlib import Path
          def deny(*args,**kwargs):
              raise RuntimeError('Network disabled in offline research')
          socket.socket=deny
          socket.create_connection=deny
          from run_entry import run
          raise SystemExit(run(Path('parent'),Path('results')))
          PY
          result=${PIPESTATUS[0]}
          set -e
          echo "::$nonce::"
          exit "$result"
      - name: Show only this run's completed results
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('results/SUMMARY.json')
          text='# No complete validated result\n'
          if os.environ.get('EXPERIMENT_OUTCOME')=='success' and p.is_file():
              s=json.loads(p.read_text())
              expected={k:os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')}
              if s['provenance']==expected and s['cases']==432:
                  text='# A44 entry-quality result\n```json\n'+json.dumps(s,indent=2)+'\n```\n'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(text)
          PY
      - name: Preserve full results, code, parent inputs and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entry44-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            evidence/
            parent/
          retention-days: 7
          if-no-files-found: error
