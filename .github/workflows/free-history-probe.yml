name: Free historical data download probe
on:
  push:
    branches: [research/issue-1-chat-actions]
    paths: ['.github/workflows/free-history-probe.yml']
permissions: {}
concurrency:
  group: free-history-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch bounded public samples without credentials or checkout
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 480s python3 - <<'PYPROBE'
          """Bounded, unauthenticated public-data download probe. Never executes downloaded data."""
          import csv
          import gzip
          import hashlib
          import io
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal
          
          MIB = 1024 * 1024
          ALLOWED = frozenset({
              'huggingface.co', 'cdn-lfs.huggingface.co', 'cdn-lfs-us-1.hf.co',
              'cas-bridge.xethub.hf.co', 'api.tardis.dev', 'datasets.tardis.dev'
          })
          HF = 'https://huggingface.co'
          REPO = 'Chainticks/perp-data'
          TARDIS = 'https://datasets.tardis.dev/v1/hyperliquid/trades/2025/01/01/ETH.csv.gz'
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def check_url(url):
              p = urllib.parse.urlsplit(url)
              require(p.scheme == 'https' and p.hostname in ALLOWED and
                      p.port in (None, 443) and not p.username and not p.password,
                      'Rejected unexpected download host or URL')
              return p
          
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  check_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          
          
          OPENER = urllib.request.build_opener(SafeRedirect())
          
          
          def get_bytes(url, cap):
              check_url(url)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'jaja-trade-public-data-probe/1.0', 'Accept-Encoding': 'identity'
              })
              deadline = time.monotonic() + 75
              with OPENER.open(request, timeout=20) as response:
                  require(response.status == 200, 'Unexpected HTTP status')
                  check_url(response.geturl())
                  length = response.headers.get('Content-Length')
                  require(not length or int(length) <= cap, 'Download exceeds declared byte cap')
                  chunks = []
                  size = 0
                  while True:
                      require(time.monotonic() <= deadline, 'Download deadline exceeded')
                      chunk = response.read(min(65536, cap - size + 1))
                      if not chunk:
                          break
                      size += len(chunk)
                      require(size <= cap, 'Download exceeds streaming byte cap')
                      chunks.append(chunk)
                  data = b''.join(chunks)
                  return data, {'bytes': size, 'sha256': hashlib.sha256(data).hexdigest(),
                                'final_host': urllib.parse.urlsplit(response.geturl()).hostname}
          
          
          def json_get(url):
              raw, evidence = get_bytes(url, 8 * MIB)
              return json.loads(raw), evidence
          
          
          def error_info(exc):
              if isinstance(exc, urllib.error.HTTPError):
                  return {'status': 'NOT_DOWNLOADED', 'error_type': 'HTTPError', 'http_status': exc.code}
              # Do not print signed redirect URLs or arbitrary network response bodies.
              return {'status': 'NOT_DOWNLOADED', 'error_type': type(exc).__name__,
                      'detail': str(exc)[:160] if isinstance(exc, ValueError) else 'See error type; no response body logged'}
          
          
          def inspect_parquet(raw):
              require(len(raw) >= 12 and raw[:4] == b'PAR1' and raw[-4:] == b'PAR1', 'Parquet framing invalid')
              footer_length = int.from_bytes(raw[-8:-4], 'little')
              require(0 < footer_length <= len(raw) - 12, 'Parquet footer length invalid')
              return {'status': 'DOWNLOADED_PARQUET_FRAMING_CHECKED', 'footer_bytes': footer_length,
                      'rows_decoded': False, 'historical_completeness': 'NOT_VERIFIED'}
          
          
          def hf_probe():
              info, meta_evidence = json_get(HF + '/api/datasets/' + REPO)
              require(info.get('id') == REPO and not info.get('private'), 'Wrong or private dataset')
              sha = info.get('sha', '')
              require(re.fullmatch('[0-9a-f]{40}', sha) is not None, 'Invalid public dataset revision')
              files = [x['rfilename'] for x in info.get('siblings', []) if isinstance(x, dict) and isinstance(x.get('rfilename'), str)]
              require(files, 'Public file inventory unavailable')
              result = {'status': 'METADATA_DOWNLOADED', 'dataset': REPO, 'revision': sha,
                        'metadata_evidence': meta_evidence, 'inventory_file_count': len(files),
                        'license_from_card': info.get('cardData', {}).get('license'),
                        'top_level_entries': sorted({x.split('/')[0] for x in files})[:30]}
              base = HF + '/datasets/' + REPO + '/resolve/' + sha + '/'
              for name in ('_manifest.json', '_schema.json'):
                  if name in files:
                      try:
                          doc, evidence = json_get(base + name)
                          result[name] = {'status': 'JSON_DOWNLOADED', **evidence,
                                         'top_level_keys': sorted(doc)[:30] if isinstance(doc, dict) else [],
                                         'list_length': len(doc) if isinstance(doc, list) else None}
                      except Exception as exc:
                          result[name] = error_info(exc)
              parquet = sorted(x for x in files if x.endswith('.parquet'))
              result['parquet_file_count'] = len(parquet)
              dates = sorted({d for x in parquet for d in re.findall(r'(20[0-9]{2}-[01][0-9]-[0-3][0-9])', x)})
              result['date_labels'] = {'first': dates[0] if dates else None, 'last': dates[-1] if dates else None,
                                       'count': len(dates), 'not_verified_contiguous': True}
              if parquet:
                  name = parquet[0]
                  require(not name.startswith('/') and '..' not in name.split('/'), 'Invalid dataset path')
                  result['sample_path'] = name
                  try:
                      raw, evidence = get_bytes(base + urllib.parse.quote(name, safe='/='), 32 * MIB)
                      result['sample'] = {**evidence, **inspect_parquet(raw)}
                  except Exception as exc:
                      result['sample'] = error_info(exc)
              return result
          
          
          def validate_trades(data):
              require(data[:2] == b'\x1f\x8b', 'Not a gzip response')
              out = bytearray()
              with gzip.GzipFile(fileobj=io.BytesIO(data)) as g:
                  while True:
                      chunk = g.read(min(65536, 300 * MIB - len(out) + 1))
                      if not chunk:
                          break
                      out.extend(chunk)
                      require(len(out) <= 300 * MIB, 'Uncompressed CSV byte cap exceeded')
              text = out.decode('utf-8-sig')
              reader = csv.DictReader(io.StringIO(text, newline=''))
              fields = {'exchange', 'symbol', 'timestamp', 'local_timestamp', 'id', 'side', 'price', 'amount'}
              require(fields.issubset(set(reader.fieldnames or ())), 'Required trade columns missing')
              start = int(datetime(2025, 1, 1, tzinfo=timezone.utc).timestamp()) * 1_000_000
              end = start + 86_400 * 1_000_000
              count = 0
              previous_local = start
              first_exchange = None
              last_exchange = None
              minimum_price = None
              maximum_price = None
              exchange_time_reversals = 0
              previous_exchange = None
              for row in reader:
                  require(row.get('exchange') == 'hyperliquid' and row.get('symbol') == 'ETH', 'Unexpected market or symbol')
                  require(row.get('side') in ('buy', 'sell'), 'Invalid trade side')
                  local, ts = int(row['local_timestamp']), int(row['timestamp'])
                  require(start <= local < end and local >= previous_local, 'Wrong date or nonmonotonic capture timestamp')
                  require(ts > 0, 'Invalid exchange timestamp')
                  price, amount = Decimal(row['price']), Decimal(row['amount'])
                  require(price.is_finite() and price > 0 and amount.is_finite() and amount > 0, 'Invalid trade price or amount')
                  if previous_exchange is not None and ts < previous_exchange:
                      exchange_time_reversals += 1
                  previous_exchange, previous_local = ts, local
                  count += 1
                  first_exchange = ts if first_exchange is None else min(first_exchange, ts)
                  last_exchange = ts if last_exchange is None else max(last_exchange, ts)
                  minimum_price = price if minimum_price is None else min(price, minimum_price)
                  maximum_price = price if maximum_price is None else max(price, maximum_price)
              require(count > 0, 'No trades in public sample')
              return {'status': 'DOWNLOADED_AND_ROW_VALIDATED', 'rows': count, 'csv_bytes': len(out),
                      'columns': reader.fieldnames, 'exchange': 'hyperliquid', 'symbol': 'ETH',
                      'capture_date_utc': '2025-01-01', 'first_exchange_us': first_exchange,
                      'last_exchange_us': last_exchange, 'min_price': str(minimum_price), 'max_price': str(maximum_price),
                      'exchange_time_reversals': exchange_time_reversals,
                      'market_completeness': 'NOT_VERIFIED_NO_INDEPENDENT_SOURCE'}
          
          
          def tardis_probe():
              data, evidence = get_bytes(TARDIS, 64 * MIB)
              return {'url': TARDIS, **evidence, **validate_trades(data)}
          
          
          def main():
              result = {'mode': 'PUBLIC_DOWNLOAD_TEST_NOT_BACKTEST', 'new_paid_services': 0,
                        'authentication_used': False, 'started_utc': datetime.now(timezone.utc).isoformat()}
              for name, probe in (('chainticks', hf_probe), ('tardis', tardis_probe)):
                  try:
                      result[name] = probe()
                  except Exception as exc:
                      result[name] = error_info(exc)
              result['finished_utc'] = datetime.now(timezone.utc).isoformat()
              ok = result['tardis']['status'] == 'DOWNLOADED_AND_ROW_VALIDATED'
              result['status'] = 'PUBLIC_TRADE_DOWNLOAD_VERIFIED' if ok else 'TRADE_DOWNLOAD_NOT_VERIFIED'
              print('PUBLIC_DATA_PROBE_RESULT=' + json.dumps(result, ensure_ascii=True, sort_keys=True))
              return 0 if ok else 1
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PYPROBE
