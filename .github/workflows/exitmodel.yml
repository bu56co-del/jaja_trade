name: Exit execution model sensitivity on A44 and September
on:
  push:
    branches: [research/issue-1-chat-actions]
    paths: ['exitmodel/**', '.github/workflows/exitmodel.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: exitmodel-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}/application:${{ github.workspace }}/application/tests:${{ github.workspace }}/longer:${{ github.workspace }}/execution:${{ github.workspace }}/reversal44:${{ github.workspace }}/alternatives44:${{ github.workspace }}/mean44:${{ github.workspace }}/direction44:${{ github.workspace }}/refine44:${{ github.workspace }}/entry44:${{ github.workspace }}/threshold44:${{ github.workspace }}/crossperiod:${{ github.workspace }}/leverage44:${{ github.workspace }}/leverage1020:${{ github.workspace }}/fixedrisk:${{ github.workspace }}/exitmodel
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore pinned fixed-risk parent with all historical evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fixedrisk-final-35885160110-1
          run-id: '35885160110'
          github-token: ${{ github.token }}
          path: parent
      - name: Restore unchanged original application and preserve tested source
        run: |
          python3 bootstrap.py
          mkdir -p evidence
          cp -R application evidence/original-source
          cp -R fixedrisk evidence/fixedrisk-source
          cp -R exitmodel evidence/exitmodel-source
          cp .github/workflows/exitmodel.yml evidence/workflow.yml
      - name: Original account and relevant strategy regressions
        run: |
          timeout 180s python3 -m unittest discover -s application/tests -v 2>&1 | tee evidence/account-tests.log
          timeout 120s python3 -m unittest discover -s mean44/tests -v 2>&1 | tee evidence/mean-tests.log
          timeout 120s python3 -m unittest discover -s refine44/tests -v 2>&1 | tee evidence/refine-tests.log
          timeout 120s python3 -m unittest discover -s entry44/tests -v 2>&1 | tee evidence/entry-tests.log
          timeout 120s python3 -m unittest discover -s threshold44/tests -v 2>&1 | tee evidence/threshold-tests.log
          timeout 120s python3 -m unittest discover -s crossperiod/tests -v 2>&1 | tee evidence/crossperiod-tests.log
          timeout 120s python3 -m unittest discover -s leverage44/tests -v 2>&1 | tee evidence/leverage-tests.log
      - name: Fixed-risk and new exit-model tests with network disabled
        run: |
          timeout 180s python3 - <<'PY' 2>&1 | tee evidence/fixed-and-exit-tests.log
          import sys,unittest
          def deny(event,args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn'):
                  raise RuntimeError('Offline exit model tests')
          sys.addaudithook(deny)
          for directory in ('fixedrisk/tests','exitmodel/tests'):
              suite=unittest.TestLoader().discover(directory)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():raise SystemExit(1)
          PY
      - name: Run all1344 accounts with network and child processes denied
        id: experiment
        run: |
          nonce="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          echo "::stop-commands::$nonce"
          set +e
          timeout --signal=TERM --kill-after=10s 1320s python3 - <<'PY' 2>&1 | tee evidence/research.log
          import sys
          def deny(event,args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn'):
                  raise RuntimeError('Offline exit-model research')
          sys.addaudithook(deny)
          import socket,ssl
          from pathlib import Path
          for probe in (lambda:socket.socket(),lambda:socket.getaddrinfo('localhost',80)):
              try:probe()
              except RuntimeError:pass
              else:raise RuntimeError('Offline guard inactive')
          from run_exitmodel import run
          raise SystemExit(run(Path('parent'),Path('results')))
          PY
          result=${PIPESTATUS[0]}
          set -e
          echo "::$nonce::"
          exit "$result"
      - name: Show only complete matching-run results
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('results/SUMMARY.json');text='# No complete verified exit-model result\n'
          if os.environ.get('EXPERIMENT_OUTCOME')=='success' and p.is_file():
              s=json.loads(p.read_text())
              expected={k:os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')}
              if s['provenance']==expected and s['cases']==1344 and s['baseline_equivalence']==336:
                  text='# Exit execution sensitivity - not strategy alpha\n```json\n'+json.dumps(s,indent=2)+'\n```\n'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(text)
          PY
      - name: Preserve all parent inputs, tested sources, results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exitmodel-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            evidence/
            parent/
          retention-days: 7
          if-no-files-found: error
